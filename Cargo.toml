[package]
name = "rust-browser"
version = "0.1.0"
edition = "2021"
authors = ["IrisVerse Rust Browser Team"]
description = "A browser engine built with obscura, taffy and tiny-skia"

[[bin]]
name = "rust_browser"
path = "src/main.rs"

[dependencies]
lazy_static = "1.4"

# taffy 0.10.0 本地源码
taffy = { path = "../taffy-0.10.0", features = ["block_layout", "flexbox", "grid"] }

# tiny-skia 0.12.0 本地源码
tiny-skia = { path = "../tiny-skia-0.12.0" }

# cosmic-text 0.19.0 本地源码
cosmic-text = { path = "../cosmic-text-0.19.0" }

reqwest = { version = "0.12", features = ["gzip", "brotli", "blocking"] }

# kuchiki 0.12.0 本地源码
kuchiki = { path = "../kuchikikiki-0.12.0", package = "kuchikikiki" }

obscura-dom = { path = "../obscura/crates/obscura-dom" }
obscura-js = { path = "../obscura/crates/obscura-js", optional = true }
obscura-net = { path = "../obscura/crates/obscura-net" }

# Boa JS 引擎（纯 Rust，无需 V8，可选）
boa_engine = { version = "0.21", optional = true }
boa_gc = { version = "0.21", optional = true }

# GUI 可选（Windows wgpu 编译问题）
eframe = { version = "0.34", optional = true, default-features = false, features = ["default"] }
egui = { version = "0.34", optional = true }

crossbeam-deque = "0.8"
tokio = { version = "1", features = ["full"] }

cssparser = "0.35"
selectors = "0.27"
precomputed-hash = "0.1"

log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
anyhow = "1.0"
parking_lot = "0.12"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
url = "2.5"

resvg = { version = "0.47", default-features = false, features = [] }
usvg = { version = "0.47", default-features = false, features = [] }
regex = "1.11"

image = { version = "0.25.1", features = ["png", "jpeg", "gif", "webp", "bmp"] }
brotli = "7.0"
flate2 = "1.0"
serde_json = "1.0"

[features]
default = ["boa", "gui"]

# JS 引擎后端
js = ["obscura-js"]           # obscura-js (V8/Deno 后端)
boa = ["boa_engine", "boa_gc"] # Boa JS 引擎 (纯 Rust)

# GUI 窗口模式
gui = ["eframe", "egui"]

# 无头模式：禁用 GUI 和 JS 引擎，只保留渲染核心 + bridge
# 
# 特性:
# - 无 eframe/egui GUI 依赖
# - 无 Boa/obscura-js JS 引擎
# - 只保留 DOM 解析、CSS 布局、渲染核心
# - WebNativeBridge trait 可用
#
# 用途:
# - 服务器端渲染 (SSR)
# - 自动化测试
# - jrust-runtime 集成
# - CI/CD 环境截图
#
# 使用方式:
#   cargo build --no-default-features --features headless
#   或在依赖中指定:
#   rust-browser = { ..., default-features = false, features = ["headless"] }
headless = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1  # debug 模式轻微优化，避免过长的编译时间
