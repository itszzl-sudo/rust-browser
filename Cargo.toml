[package]
name = "rust-browser"
version = "0.1.0"
edition = "2021"
authors = ["IrisVerse Rust Browser Team"]
description = "A browser engine built with obscura, taffy and tiny-skia"

[[bin]]
name = "rust_browser"
path = "src/main.rs"

[dependencies]
lazy_static = "1.4"

taffy = { version = "0.10", features = ["block_layout", "flexbox", "grid"] }
tiny-skia = "0.12"
cosmic-text = { path = "../cosmic-text-0.19.0" }
reqwest = { version = "0.12", features = ["gzip", "brotli", "blocking"] }
kuchiki = { path = "../kuchikikiki-0.12.0", package = "kuchikikiki" }
html5ever = "0.39"

# V8 JS 引擎（deno_core）
deno_core = { version = "0.350", optional = true }

# Boa JS 引擎（纯 Rust，无需 V8，可选）
boa_engine = { version = "0.21", optional = true }
boa_gc = { version = "0.21", optional = true }

# QuickJS 引擎（轻量级 C 引擎，可选）
# quickjs-rs = { version = "0.4", optional = true }  # TODO: 添加

# GUI 可选（Windows wgpu 编译问题）
eframe = { version = "0.34", optional = true, default-features = false, features = ["default"] }
egui = { version = "0.34", optional = true }

crossbeam-deque = "0.8"
tokio = { version = "1", features = ["full"] }

cssparser = "0.35"
selectors = "0.27"

# 原生窗口覆盖层（跳过 egui，GDI 直接渲染 RGBA 像素）
raw-window-handle = { version = "0.6", optional = true }

# 跨平台窗口系统（替代 GDI）
winit = { version = "0.30", optional = true, features = ["rwh_06"] }
# 软件帧缓冲区 - 将 RGBA 像素直接显示到 winit 窗口
softbuffer = { version = "0.4", optional = true }

# 旧版 GDI（即将移除，替换为 winit）
windows-sys = { version = "0.52", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
precomputed-hash = "0.1"

log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
anyhow = "1.0"
parking_lot = "0.12"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
url = "2.5"

resvg = { version = "0.47", default-features = false, features = [] }
usvg = { version = "0.47", default-features = false, features = [] }
regex = "1.11"
httpdate = "1.0"

image = { version = "0.25.1", features = ["png", "jpeg", "gif", "webp", "bmp"] }
brotli = "7.0"
flate2 = "1.0"
serde_json = "1.0"
urlencoding = "2.1"

[features]
default = ["browser", "boa"]

# ── 用途模式（互斥） ──

# 嵌入模式：给 javascript-web-to-rust-native 使用
#
# 特性:
# - 无 GUI（无 eframe/egui）
# - WebNativeBridge API 完整可用
# - 事件系统（点击、表单、window.open）
# - 网络请求（HTTP GET/POST）
# - 文件操作（下载、读写）
# - 渲染到内存（PNG 字节）
# - JS 引擎可选（默认无）
#
# 用途:
# - jrust-runtime 集成
# - 服务器端渲染 (SSR)
# - 自动化测试
# - CI/CD 环境截图
embed = []

# 浏览器模式：正常浏览器
#
# 特性:
# - GUI 窗口（egui）
# - 多标签页
# - 地址栏、导航按钮
# - JS 引擎必需
#
browser = ["gui"]

# ── JS 引擎（互斥） ──

# Boa JS 引擎（纯 Rust）
boa = ["boa_engine", "boa_gc"]

# QuickJS 引擎（C 库，轻量级）
# quickjs = ["quickjs-rs"]  # TODO: 待实现

# V8 引擎（deno_core）
v8 = ["deno_core"]

# ── GUI（仅浏览器模式） ──

gui = ["eframe", "egui", "raw-window-handle", "winit", "softbuffer"]

# ── 向后兼容 ──

# headless 重命名为 embed
headless = ["embed"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1  # debug 模式轻微优化，避免过长的编译时间
