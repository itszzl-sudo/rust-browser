[package]
name = "rust-browser"
version = "0.1.0"
edition = "2021"
authors = ["IrisVerse Rust Browser Team"]
description = "A browser engine built with obscura, taffy and tiny-skia"

[[bin]]
name = "rust_browser"
path = "src/main.rs"

[dependencies]
lazy_static = "1.4"

# taffy 0.10.0 本地源码
taffy = { path = "../taffy-0.10.0", features = ["block_layout", "flexbox", "grid"] }

# tiny-skia 0.12.0 本地源码
tiny-skia = { path = "../tiny-skia-0.12.0" }

# cosmic-text 0.19.0 本地源码
cosmic-text = { path = "../cosmic-text-0.19.0" }

reqwest = { version = "0.12", features = ["gzip", "brotli", "blocking"] }

# kuchiki 0.12.0 本地源码
kuchiki = { path = "../kuchikikiki-0.12.0", package = "kuchikikiki" }

# V8 JS 引擎（deno_core）
deno_core = { version = "0.350", optional = true }

# Boa JS 引擎（纯 Rust，无需 V8，可选）
boa_engine = { version = "0.21", optional = true }
boa_gc = { version = "0.21", optional = true }

# QuickJS 引擎（轻量级 C 引擎，可选）
# quickjs-rs = { version = "0.4", optional = true }  # TODO: 添加

# GUI 可选（Windows wgpu 编译问题）
eframe = { version = "0.34", optional = true, default-features = false, features = ["default"] }
egui = { version = "0.34", optional = true }

crossbeam-deque = "0.8"
tokio = { version = "1", features = ["full"] }

cssparser = "0.35"
selectors = "0.27"
precomputed-hash = "0.1"

log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
anyhow = "1.0"
parking_lot = "0.12"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
url = "2.5"

resvg = { version = "0.47", default-features = false, features = [] }
usvg = { version = "0.47", default-features = false, features = [] }
regex = "1.11"

image = { version = "0.25.1", features = ["png", "jpeg", "gif", "webp", "bmp"] }
brotli = "7.0"
flate2 = "1.0"
serde_json = "1.0"

[features]
default = ["browser", "boa"]

# ── 用途模式（互斥） ──

# 嵌入模式：给 javascript-web-to-rust-native 使用
#
# 特性:
# - 无 GUI（无 eframe/egui）
# - WebNativeBridge API 完整可用
# - 事件系统（点击、表单、window.open）
# - 网络请求（HTTP GET/POST）
# - 文件操作（下载、读写）
# - 渲染到内存（PNG 字节）
# - JS 引擎可选（默认无）
#
# 用途:
# - jrust-runtime 集成
# - 服务器端渲染 (SSR)
# - 自动化测试
# - CI/CD 环境截图
embed = []

# 浏览器模式：正常浏览器
#
# 特性:
# - GUI 窗口（egui）
# - 多标签页
# - 地址栏、导航按钮
# - JS 引擎必需
#
browser = ["gui"]

# ── JS 引擎（互斥） ──

# Boa JS 引擎（纯 Rust）
boa = ["boa_engine", "boa_gc"]

# QuickJS 引擎（C 库，轻量级）
# quickjs = ["quickjs-rs"]  # TODO: 待实现

# V8 引擎（deno_core）
v8 = ["deno_core"]

# ── GUI（仅浏览器模式） ──

gui = ["eframe", "egui"]

# ── 向后兼容 ──

# headless 重命名为 embed
headless = ["embed"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1  # debug 模式轻微优化，避免过长的编译时间
